name: Build Mod JAR
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build JAR
        run: gradle build
      - name: Upload Ready JAR
        uses: actions/upload-artifact@v4
        with:
          name: true-damage-chat-jar
          path: build/libs/*.jar
